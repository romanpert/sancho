name: Release

# Publica en PyPI al empujar un tag v*.*.*, con Trusted Publisher (OIDC): sin tokens.
# Mismo patron que romanpert/mcp-aemps, con hatchling en vez de poetry.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build

      - name: Verify the tag matches the version in pyproject
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG does not match pyproject version $VER" >&2
            exit 1
          fi

      # Nada se publica sin pasar por lo mismo que la CI: nadie sube un paquete roto.
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Replay the public benches from the recorded fixture
        run: sancho bench benches/core.jsonl benches/safety.jsonl benches/graph.jsonl --provider recorded --fixture fixtures/public-benches.jsonl

      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher / OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sancho-ai/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
