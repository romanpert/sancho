[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sancho-ai"          # el nombre `sancho` estaba cogido en PyPI; se importa como `sancho`
version = "0.1.0"
description = "A calibrated, non-generative decision layer (a squire) for LLM agent harnesses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Roman Perez", email = "roman.p98@gmail.com" }]
keywords = [
  "agents", "llm", "routing", "calibration", "prompt-injection", "citation-verification",
  "system-one", "typesafe", "jev", "mcp", "claude-code", "harness",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
jev = ["httpx>=0.27"]
llm = ["httpx>=0.27"]
mcp = ["mcp>=1.2"]
langchain = ["langchain>=1.3"]
all = ["httpx>=0.27", "mcp>=1.2", "langchain>=1.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
sancho = "sancho.cli:main"

[project.entry-points."sancho.providers"]
jev = "sancho.providers.jev:JevDecider"
recorded = "sancho.providers.recorded:RecordedDecider"
null = "sancho.providers.null:NullDecider"
llm = "sancho.providers.llm:LLMDecider"

[project.urls]
Homepage = "https://github.com/romanpert/sancho"
Documentation = "https://github.com/romanpert/sancho/tree/main/docs"
Paper = "https://github.com/romanpert/sancho/blob/main/docs/paper.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sancho"]

[tool.hatch.build.targets.sdist]
include = ["src/sancho", "benches", "fixtures", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
